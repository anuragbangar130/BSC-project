<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Activity History - BCS Pedia</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f8;
            color: #222;
        }

        header {
            background: #202122;
            color: white;

            padding: 18px 30px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 24px;
        }

        .header-buttons button {
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            color: white;
            font-weight: bold;
            margin-left: 8px;
        }

        .dashboard-btn {
            background: #36c;
        }

        .logout-btn {
            background: #d33;
        }

        .dashboard-btn:hover {
            background: #2455a4;
        }

        .logout-btn:hover {
            background: #b52b2b;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 30px auto;
        }

        .top-section {
            background: white;

            padding: 22px;

            border-radius: 10px;

            margin-bottom: 20px;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.08);
        }

        .top-section h2 {
            margin-bottom: 8px;
        }

        .top-section p {
            color: #666;
        }

        .search-box {
            width: 100%;

            padding: 12px;

            margin-top: 15px;

            border: 1px solid #ccc;

            border-radius: 6px;

            font-size: 15px;
        }

        .search-box:focus {
            outline: none;
            border-color: #36c;
        }

        .history-card {
            background: white;

            padding: 20px;

            margin-bottom: 15px;

            border-radius: 10px;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.08);
        }

        .action {
            display: inline-block;

            padding: 6px 12px;

            border-radius: 5px;

            color: white;

            font-size: 13px;

            font-weight: bold;

            margin-bottom: 10px;
        }

        .action-add {
            background: #14866d;
        }

        .action-update {
            background: #36c;
        }

        .action-delete {
            background: #d33;
        }

        .action-other {
            background: #555;
        }

        .history-card h3 {
            margin-bottom: 12px;
        }

        .info {
            margin: 7px 0;
            color: #555;
        }

        .description {
            margin-top: 15px;

            padding: 14px;

            background: #f5f5f5;

            border-radius: 6px;

            line-height: 1.5;
        }

        .description strong {
            display: block;
            margin-bottom: 5px;
        }

        .no-history {
            background: white;

            padding: 35px;

            text-align: center;

            border-radius: 10px;

            color: #666;
        }

        .count-box {
            margin-top: 12px;
            font-weight: bold;
            color: #444;
        }

        @media (max-width: 700px) {

            header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            .header-buttons {
                display: flex;
                gap: 8px;
            }

            .header-buttons button {
                margin-left: 0;
            }

            .container {
                width: 94%;
            }

        }

    </style>

</head>


<body>


<header>

    <h1>
        Admin Activity History
    </h1>


    <div class="header-buttons">

        <button
            class="dashboard-btn"
            onclick="goDashboard()">

            Dashboard

        </button>


        <button
            class="logout-btn"
            onclick="logout()">

            Logout

        </button>

    </div>

</header>



<div class="container">


    <div class="top-section">

        <h2>
            All User Activities
        </h2>


        <p>
            View ADD, UPDATE and DELETE activities
            performed by Student and Teacher users.
        </p>


        <input
            type="text"
            id="searchBox"
            class="search-box"
            placeholder="Search by user, username, title, action or role..."
            oninput="searchHistory()">


        <div
            id="countBox"
            class="count-box">
        </div>

    </div>



    <div id="historyContainer">

        <div class="no-history">
            Loading activity history...
        </div>

    </div>


</div>



<script>


/* =====================================
   LOGIN CHECK
   ===================================== */

const userData =
    localStorage.getItem(
        "bcsPediaUser"
    );


if (!userData) {

    window.location.href =
        "login.html";

}


let user;


try {

    user =
        JSON.parse(userData);

} catch (error) {

    localStorage.clear();

    window.location.href =
        "login.html";

}



/* =====================================
   ADMIN CHECK
   ===================================== */

if (!user || user.role !== "admin") {

    alert(
        "Access denied. Admin only."
    );

    window.location.href =
        "login.html";

}



/* =====================================
   GLOBAL HISTORY
   ===================================== */

let allHistory = [];



/* =====================================
   LOAD HISTORY
   ===================================== */

function loadHistory() {

    const container =
        document.getElementById(
            "historyContainer"
        );


    container.innerHTML = `
        <div class="no-history">
            Loading activity history...
        </div>
    `;


    fetch(
        "backend/get_all_history.php"
    )

    .then(response => {

        if (!response.ok) {

            throw new Error(
                "Server error"
            );

        }

        return response.json();

    })

    .then(result => {

        if (!result.success) {

            container.innerHTML = `
                <div class="no-history">
                    ${escapeHtml(
                        result.message
                    )}
                </div>
            `;

            return;

        }


        allHistory =
            Array.isArray(result.data)
                ? result.data
                : [];


        displayHistory(
            allHistory
        );

    })

    .catch(error => {

        console.error(error);

        container.innerHTML = `
            <div class="no-history">
                Could not load activity history.
            </div>
        `;

        document.getElementById(
            "countBox"
        ).textContent = "";

    });

}



/* =====================================
   DISPLAY HISTORY
   ===================================== */

function displayHistory(history) {

    const container =
        document.getElementById(
            "historyContainer"
        );


    const countBox =
        document.getElementById(
            "countBox"
        );


    countBox.textContent =
        "Activities found: " +
        history.length;


    if (
        !history ||
        history.length === 0
    ) {

        container.innerHTML = `
            <div class="no-history">
                No activity found.
            </div>
        `;

        return;

    }


    container.innerHTML = "";


    history.forEach(item => {


        const action =
            String(
                item.action || ""
            ).toUpperCase();


        let actionClass =
            "action-other";


        if (action === "ADD") {

            actionClass =
                "action-add";

        }

        else if (action === "UPDATE") {

            actionClass =
                "action-update";

        }

        else if (action === "DELETE") {

            actionClass =
                "action-delete";

        }


        let date = "-";


        if (item.created_at) {

            const d =
                new Date(
                    item.created_at
                );


            if (
                !isNaN(
                    d.getTime()
                )
            ) {

                date =
                    d.toLocaleString();

            }

        }


        const card =
            document.createElement(
                "div"
            );


        card.className =
            "history-card";


        card.innerHTML = `

            <span
                class="action ${actionClass}">

                ${escapeHtml(
                    action || "UNKNOWN"
                )}

            </span>


            <h3>
                ${escapeHtml(
                    item.title ||
                    "Untitled"
                )}
            </h3>


            <p class="info">

                <strong>User:</strong>
                ${escapeHtml(
                    item.user_name ||
                    "-"
                )}

            </p>


            <p class="info">

                <strong>Username:</strong>
                ${escapeHtml(
                    item.username ||
                    "-"
                )}

            </p>


            <p class="info">

                <strong>Role:</strong>
                ${escapeHtml(
                    item.role ||
                    "-"
                )}

            </p>


            <p class="info">

                <strong>Date & Time:</strong>
                ${escapeHtml(
                    date
                )}

            </p>


            <div class="description">

                <strong>
                    Description:
                </strong>

                <p>
                    ${escapeHtml(
                        item.description ||
                        "No description"
                    )}
                </p>

            </div>

        `;


        container.appendChild(
            card
        );

    });

}



/* =====================================
   SEARCH HISTORY
   ===================================== */

function searchHistory() {

    const search =
        document.getElementById(
            "searchBox"
        ).value
        .toLowerCase()
        .trim();


    if (search === "") {

        displayHistory(
            allHistory
        );

        return;

    }


    const filtered =
        allHistory.filter(item => {

            const userName =
                String(
                    item.user_name || ""
                ).toLowerCase();


            const username =
                String(
                    item.username || ""
                ).toLowerCase();


            const title =
                String(
                    item.title || ""
                ).toLowerCase();


            const action =
                String(
                    item.action || ""
                ).toLowerCase();


            const role =
                String(
                    item.role || ""
                ).toLowerCase();


            const description =
                String(
                    item.description || ""
                ).toLowerCase();


            return (

                userName.includes(search)

                ||

                username.includes(search)

                ||

                title.includes(search)

                ||

                action.includes(search)

                ||

                role.includes(search)

                ||

                description.includes(search)

            );

        });


    displayHistory(
        filtered
    );

}



/* =====================================
   HTML ESCAPE
   ===================================== */

function escapeHtml(value) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        value;


    return div.innerHTML;

}



/* =====================================
   DASHBOARD
   ===================================== */

function goDashboard() {

    window.location.href =
        "admin_dashboard.html";

}



/* =====================================
   LOGOUT
   ===================================== */

function logout() {

    localStorage.removeItem(
        "bcsPediaUser"
    );

    localStorage.removeItem(
        "bcsPediaPattern"
    );

    localStorage.removeItem(
        "bcsPediaYear"
    );

    localStorage.removeItem(
        "bcsPediaSubject"
    );

    localStorage.removeItem(
        "bcsPediaSemester"
    );

    localStorage.removeItem(


    window.location.href =
        "login.html";

}



/* =====================================
   INITIAL LOAD
   ===================================== */

loadHistory();


</script>


</body>

</html>
